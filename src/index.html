<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@500;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>Pokédex</title>
  </head>
  <body>

    <!-- Settings panel (fixed, toggled by green LED) -->
    <div id="settings-panel">
      <h3 class="settings-heading">Voice Settings</h3>
      <label class="settings-label">Language
        <select id="lang-select" class="settings-select"></select>
      </label>
      <label class="settings-label">Voice
        <select id="voice-select" class="settings-select"></select>
      </label>
      <label class="settings-label">Rate <span id="rate-value">0.75</span>
        <input id="rate-slider" class="settings-slider" type="range" min="0.1" max="2" step="0.05" value="0.75" />
      </label>
      <label class="settings-label">Pitch <span id="pitch-value">1</span>
        <input id="pitch-slider" class="settings-slider" type="range" min="0" max="2" step="0.1" value="1" />
      </label>
      <label class="settings-label">Volume <span id="volume-value">1</span>
        <input id="volume-slider" class="settings-slider" type="range" min="0" max="1" step="0.05" value="1" />
      </label>
    </div>

    <!-- Pokédex device -->
    <div id="pokedex">

      <!-- ── Header ───────────────────────────────────────────── -->
      <header id="pokedex-header">
        <div class="profile-section">
          <img class="profile-pic" src="profile.jpg" alt="Guy Johnston" />
          <p class="profile-name">Guy Johnston<br />Pokémon Trainer</p>
        </div>
        <h1>PokéSearch</h1>
        <div class="led-group">
          <div class="red-ellipse"></div>
          <div class="yellow-ellipse"></div>
          <div class="green-ellipse" id="settings-toggle" title="Voice Settings"></div>
        </div>
      </header>

      <!-- ── Search ────────────────────────────────────────────── -->
      <div id="search-section">
        <form id="search-form">
          <input
            class="main-search"
            id="search-input"
            type="text"
            required
            placeholder="Find Pokémon by Name"
            autocomplete="off"
            list="search-history"
          />
          <datalist id="search-history"></datalist>
          <select class="main-search" name="criteria" id="search-option">
            <option value="name">Name</option>
            <option value="id">Id</option>
            <option value="fuzzy">Fuzzy</option>
          </select>
          <button class="go-button" type="submit">GO!</button>
        </form>
        <span id="error-span"></span>
      </div>

      <!-- ── Screen ────────────────────────────────────────────── -->
      <div id="screen-bezel">
        <div id="screen-display">

          <!-- Empty state -->
          <div id="empty-pokemon-details">
            <span>Choose a Pokémon</span>
          </div>

          <!-- Loaded state (always in DOM, revealed when empty state is hidden) -->
          <div id="poke-screen-content">
            <span id="poke-number">#---</span>
            <div id="poke-image-wrapper">
              <span id="speech-bubble"></span>
              <img id="poke-image" alt="Pokémon sprite" />
            </div>
            <h2 id="poke-name"></h2>
          </div>

        </div>
      </div>

      <!-- ── Browse Controls ───────────────────────────────────── -->
      <div id="browse-controls">
        <button class="browse-button" id="browse-prev" type="button" disabled>&#9664;</button>
        <span id="browse-label">Browse All</span>
        <button class="browse-button" id="browse-next" type="button">&#9654;</button>
      </div>

      <!-- ── Details ───────────────────────────────────────────── -->
      <div id="filled-pokemon-details">
        <div id="stats-row">
          <div class="stat-block">
            <span class="stat-label">Height</span>
            <span class="stat-value" id="poke-height">—</span>
          </div>
          <div class="stat-block">
            <span class="stat-label">Weight</span>
            <span class="stat-value" id="poke-weight">—</span>
          </div>
          <div class="stat-block">
            <span class="stat-label">Type</span>
            <span class="stat-value" id="poke-type">—</span>
          </div>
        </div>
        <div id="moves-section">
          <h3 class="section-label">Moves</h3>
          <ul class="poke-moves">
            <li id="poke-move-1">—</li>
            <li id="poke-move-2">—</li>
            <li id="poke-move-3">—</li>
            <li id="poke-move-4">—</li>
            <li id="poke-move-5">—</li>
          </ul>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js" type="module"></script>
  </body>
</html>
